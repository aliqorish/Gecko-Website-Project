<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>  
            {% block title %} Gecko {% endblock %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       
       {% load static %}
       <style>
            @font-face{
                font-family: "induction";
                src: url("{% static 'fonts/Induction.ttf' %}") format('truetype');
                font-weight: normal;
                font-style:normal;
            }
            body {
                  background-color: rgb(33, 37, 43); 
                  color:#dbe9dc;
            }

            .navbar-custom {
                background-color:#121214 ;
                font-family:'induction',sans-serif;
            }
            .navbar-custom .nav-link{
                color:#ffffff;
            }
            .navbar-custom .nav-link:hover{
                color:#a8d8a9;
            }
            .navbar-custom .navbar-brand{
                color:#2d8b32;
            }
            .navbar-divider {
                  border: none;
                  height: 2px;
                  background-color: #2d8b32;
                  opacity: 0.5;
            }
            label,
            .form-label {
                color: #dbe9dc;
            }

            .form-text,
            .text-muted {
                color: #bccebe ;
            }

            .invalid-feedback {
                color: #ff6b6b;
            }
        </style>

    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                 <h2>   <a class="navbar-brand" href="">gecko</a> </h2>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                        data-bs-target="#navbarNav" aria-controls="navbarNav" 
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#">My Training Plan</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Workouts</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Create</a>
                        </li>
                        {% if user.is_authenticated %}
                            <li class="nav-item">
                                <form method="post" action="{% url 'logout' %}" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="nav-link btn btn-link">Logout</button>
                                </form>
                            </li>
                        {% else %}
                            <li class="nav-item">
                                <a class="nav-link" href="login/">Login</a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
            <hr class="navbar-divider mt-0 mb-4">
        <div class="container mt-4">
            {% block content %}
            {% endblock %}
        </div>

       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"></script>
    </body>

</html>
